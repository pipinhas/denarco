<!DOCTYPE html>
<!-- Página amigável para qualquer erro: nunca mostra detalhes técnicos ao usuário. -->
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head('Ops')}"></head>
<body>
<main class="container py-5 text-center" id="conteudo" style="max-width: 560px">
    <a class="marca fs-3" th:href="@{/}">Denarco</a>
    <div class="cartao mt-4 p-4">
        <i class="bi bi-cone-striped display-4 text-warning" aria-hidden="true"></i>
        <th:block th:switch="${status}">
            <h1 class="titulo-pagina mt-3" th:case="404">Página não encontrada</h1>
            <h1 class="titulo-pagina mt-3" th:case="403">Você não tem acesso a esta página</h1>
            <h1 class="titulo-pagina mt-3" th:case="*">Algo deu errado</h1>
        </th:block>
        <p class="subtitulo">Volte para o início e tente de novo. Se continuar, avise a equipe.</p>
        <a class="btn btn-primary btn-acao" th:href="@{/}">Voltar ao início</a>
    </div>
</main>
</body>
</html>
