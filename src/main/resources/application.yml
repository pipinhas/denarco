# Configuração comum a todos os ambientes.
spring:
  application:
    name: denarco
  profiles:
    default: dev
  jpa:
    hibernate:
      # O banco é criado só pelo Flyway; o Hibernate apenas confere se as entidades batem com as tabelas.
      ddl-auto: validate
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  servlet:
    session:
      timeout: 30m

app:
  url-base: ${APP_URL:http://localhost:8080}
  pasta-fotos: ${PASTA_FOTOS:./dados/fotos}
  # Em modo demonstração o link de "esqueci minha senha" aparece na tela, além do console.
  modo-demo: false
  admin:
    nome: Administrador
    email: ${ADMIN_EMAIL:}
    senha: ${ADMIN_SENHA:}

---
# Desenvolvimento e apresentação: H2 em arquivo, não precisa instalar banco.
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:file:./dados/denarco;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  h2:
    console:
      enabled: true
  thymeleaf:
    cache: false

app:
  modo-demo: true
  admin:
    email: admin@demo.com
    senha: demo1234

---
# HTTPS com certificado autoassinado, para testar no celular pela rede (o GPS do navegador só funciona com HTTPS).
# Usar junto com outro perfil: --spring.profiles.active=dev,https
spring:
  config:
    activate:
      on-profile: https
server:
  port: 8443
  ssl:
    key-store: file:./certificado/denarco.p12
    key-store-password: ${SSL_SENHA:denarco123}
    key-store-type: PKCS12
    key-alias: denarco
app:
  url-base: ${APP_URL:https://localhost:8443}

---
# Produção: PostgreSQL, dados de acesso vindos de variáveis de ambiente.
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/denarco}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
# E-mail: definir SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME e SPRING_MAIL_PASSWORD.
